name: Deploy marketing website

on:
  push:
    branches: [main]
    paths:
      - apps/website/**
      - docs/screenshots/**
      - apps/tauri/src-tauri/icons/128x128.png
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure image optimization tools
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: node apps/website/scripts/build.mjs
      - run: node apps/website/scripts/check.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
